        { ic: "🔧", da: ["Interne forbedringer.", "Tal og kurser formateres nu ét sted i stedet for at være kopieret rundt i appen, så de altid ser ens ud på tværs af faner. Ingen synlige ændringer."],
                     en: ["Internal improvements.", "Numbers and prices are now formatted in one place instead of being copied around the app, so they always look the same across tabs. No visible changes."] }
      ]
    },
    {
      version: "0.2.73", date: "2026-07-20",
      items: [
        { ic: "🔧", da: ["Mindre opdateringer og forbedringer.", "Interne forbedringer under motorhjelmen. Der er ingen ændringer i hvordan appen ser ud eller bruges — alt fungerer som før."],
                     en: ["Minor updates and improvements.", "Internal improvements under the hood. Nothing changes in how the app looks or works — everything behaves as before."] }
      ]
    },
    {
      version: "0.2.72", date: "2026-07-20",
      items: [
        { ic: "🌍", da: ["Aktier i alle valutaer tælles nu med.", "Ejer du fx svenske, schweiziske eller japanske aktier, kunne de forsvinde fra oversigten og dermed mangle i din samlede værdi — de stod kun i Admin. Nu hentes valutakursen automatisk for enhver valuta, så alt tæller med."],
                     en: ["Stocks in every currency now count.", "If you hold e.g. Swedish, Swiss or Japanese stocks, they could disappear from the overview and be missing from your total value — showing only in Admin. The exchange rate is now fetched automatically for any currency, so everything is included."] },
        { ic: "💸", da: ["Nyt: se prognosen i nutidskroner.", "På Prognose-fanen kan du nu sætte flueben i “Vis i nutidskroner” og selv angive inflationen. Så omregnes fremskrivningen til dagens købekraft i stedet for fremtidens kroner."],
                     en: ["New: view the projection in today's money.", "On the Projection tab you can now tick “Show in today's money” and set the inflation rate yourself. The projection is then converted to today's purchasing power instead of future kroner."] },
        { ic: "🗂️", da: ["Prognosen viser nu hvilke depoter der regnes med.", "På det samlede overblik manglede depot-vælgeren på Prognose-fanen, så fremskrivningen kunne bygge på et udvalg du ikke kunne se. Vælgeren er nu på plads begge steder."],
                     en: ["The projection now shows which portfolios are included.", "On the combined overview the portfolio picker was missing from the Projection tab, so the projection could be built on a selection you couldn't see. The picker is now present in both places."] },
        { ic: "🧮", da: ["Kostbasis kan nu beregnes for udenlandske aktier.", "“= Antal×GAK” i Admin kunne ikke regne kostbasis ud for en aktie i en valuta appen ikke kendte kursen på. Det virker nu for alle valutaer."],
                     en: ["Cost basis can now be calculated for foreign stocks.", "“= Antal×GAK” in Admin couldn't work out the cost basis for a stock in a currency the app had no rate for. It now works for every currency."] }
      ]
    },
    {
      version: "0.2.70", date: "2026-07-18",
      items: [
        { ic: "📖", da: ["Direkte link til import-guiden fra Admin.", "På Admin-siden er der nu et link ved import-boksen, der åbner den trinvise guide til at hente dine tal fra Nordnet, Nordea eller Saxo og importere dem — så du hurtigt kommer i gang."],
                     en: ["Direct link to the import guide from Admin.", "The Admin page now has a link by the import box that opens the step-by-step guide to exporting your data from Nordnet, Nordea or Saxo and importing it — so you get going quickly."] },
        { ic: "🧹", da: ["Admin ryddet lidt op.", "“Eksportér til CSV” er flyttet ned i bunden af Admin-siden, så import og porteføljer står øverst hvor du oftest bruger dem."],
                     en: ["Small Admin tidy-up.", "“Export to CSV” has moved to the bottom of the Admin page, so import and portfolios sit at the top where you use them most."] }
      ]
    },
    {
      version: "0.2.69", date: "2026-07-18",
      items: [
        { ic: "📈", da: ["FIRE-værktøjerne er nu ens på alle depoter — plus en ny “Prognose”-fane.", "Tidligere havde kun det samlede overblik den fulde FIRE-beregner. Nu har hvert enkelt depot den også (Barista, Fase 1 og 2, pensionsindkomst og Monte Carlo). Selve formue-fremskrivningen har fået sin egen fane, “Prognose”, ved siden af Fire."],
                     en: ["The FIRE tools are now the same on every portfolio — plus a new “Projection” tab.", "Previously only the combined overview had the full FIRE calculator. Now each individual portfolio has it too (Barista, Phase 1 and 2, pension income and Monte Carlo). The wealth projection itself moved to its own “Projection” tab next to Fire."] },
        { ic: "⚙️", da: ["Dine antagelser deles nu på tværs.", "De tal du indtaster i FIRE — forventet afkast, indbetaling, pensionsalder osv. — gælder nu alle steder på én gang, så du ikke skal taste dem forfra for hvert depot. Kun selve formuen varierer fra depot til depot."],
                     en: ["Your assumptions are now shared across the board.", "The numbers you enter in FIRE — expected return, contributions, retirement age, etc. — now apply everywhere at once, so you don't have to re-enter them for each portfolio. Only the wealth itself varies from portfolio to portfolio."] }
      ]
    },
    {
      version: "0.2.68", date: "2026-07-18",
      items: [
        { ic: "💻", da: ["Virker nu på Intel-Mac.", "Appen er lavet om til en universal version, så den kører native på både Intel-Mac og Apple Silicon (M1/M2/M3/M4). Én download til begge — du behøver ikke vide hvilken chip din Mac har."],
                     en: ["Now runs on Intel Macs.", "The app is now a universal build, so it runs native on both Intel Macs and Apple Silicon (M1/M2/M3/M4). One download for both — you don't need to know which chip your Mac has."] }
      ]
    },
    {
      version: "0.2.67", date: "2026-07-17",
      items: [
        { ic: "🏦", da: ["Aktiesparekonto med i FIRE-beregneren.", "Under Fase 1 og Barista FIRE kan du nu angive din aktiesparekonto som sin egen post. Den lagerbeskattes med 17 % af årets afkast hvert år, men er skattefri når du hæver — og du kan vælge om den eller de frie midler sælges først."],
                     en: ["Share savings account in the FIRE calculator.", "Under Phase 1 and Barista FIRE you can now enter your share savings account (aktiesparekonto) as its own item. It's taxed at a flat 17 % of the year's gain annually but is tax-free on withdrawal — and you choose whether it or your free funds are sold first."] },
        { ic: "🧮", da: ["Ny nøgletal: “Efter latent skat”.", "Formuen ved pension vises nu også efter den udskudte aktieskat, du stadig skylder af det, der ikke er solgt endnu — så tallet er til at leve af, ikke bare et bruttotal."],
                     en: ["New figure: “After latent tax”.", "Your wealth at retirement is now also shown after the deferred share tax you still owe on what hasn't been sold yet — so the number is what you can actually live on, not just a gross figure."] }
      ]
    },
    {
      version: "0.2.66", date: "2026-07-16",
      items: [
        { ic: "⚡", da: ["Hurtigere når kurskilden er langsom.", "Når Yahoo Finance er træg, giver appen op på et dødt kald hurtigere i stedet for at vente længe — så oversigterne ikke hænger. Watchlisten cacher nu det den kan og opdaterer kun kurserne i baggrunden, så den føles hurtig."],
                     en: ["Faster when the price source is slow.", "When Yahoo Finance is sluggish, the app gives up on a dead call sooner instead of waiting a long time — so the overviews don't hang. The watchlist now caches what it can and only refreshes prices in the background, so it feels quick."] },
        { ic: "🛡️", da: ["Færre database-hikke under belastning.", "Databasen prøver nu igen ved kortvarige låsninger i stedet for at fejle, så data loader mere stabilt."],
                     en: ["Fewer database hiccups under load.", "The database now retries on brief locks instead of failing, so data loads more reliably."] }
      ]
    },
    {
      version: "0.2.65", date: "2026-07-16",
      items: [
        { ic: "📋", da: ["Ny: watchlister (kandidatbænk).", "Under Aktieoverblik er der nu en Watchlist-fane ved siden af dine egne aktier. Følg aktier du ikke ejer i én eller flere navngivne lister — de tæller ikke med i porteføljen. Fokus på kurs, analytiker-anbefalinger, kursmål, sentiment og næste regnskab."],
                     en: ["New: watchlists (candidate bench).", "Holdings now has a Watchlist tab next to your own stocks. Track stocks you don't own in one or more named lists — they don't count toward the portfolio. Focused on price, analyst recommendations, price targets, sentiment and next earnings."] },
        { ic: "🔍", da: ["Søg enhver aktie fra top-baren.", "En ny søgeknap øverst slår enhver aktie, ETF eller fond op mod Yahoo Finance og viser live-info — kurs, nøgletal, kursmål, sentiment og næste regnskab. Husker dine seneste 10 opslag."],
                     en: ["Search any stock from the top bar.", "A new search button up top looks up any stock, ETF or fund on Yahoo Finance and shows live info — price, key figures, price target, sentiment and next earnings. Remembers your last 10 lookups."] },
        { ic: "📝", da: ["Skriv noter på en aktie.", "Gem en fri note pr. aktie — fx hvorfor du følger den, kursmål eller egne tanker. Foldes ud fra en lille knap i aktiens detaljevisning."],
                     en: ["Write notes on a stock.", "Save a free-text note per stock — e.g. why you're watching it, a price target or your own thoughts. Expands from a small button in the stock's detail view."] },
        { ic: "🔥", da: ["Mere præcis FIRE-skat: anskaffelsessum + ETF/aktier-split.", "I FIRE/Barista/Pension kan du nu angive anskaffelsessum på de frie midler (så kun gevinstandelen beskattes ved salg) og fordele mellem enkeltaktier (realisationsbeskatning) og ETF/fonde (lagerbeskatning). Anskaffelsessum sættes separat for hvert afsnit."],
                     en: ["More precise FIRE tax: acquisition cost + ETF/shares split.", "In FIRE/Barista/Pension you can now enter the acquisition cost of your free funds (so only the gain portion is taxed on sale) and split between individual shares (realisation tax) and ETFs/funds (mark-to-market tax). Acquisition cost is set separately per section."] }
      ]
    },
    {
      version: "0.2.63", date: "2026-07-16",
      items: [
        { ic: "📉", da: ["Se hvor meget du sælger af dine frie midler hvert år.", "Ny graf i Fase 2 (og nu også på Fire- og Barista-graferne): hold musen over et år og se hvor meget der sælges. Det er lavt så længe pensionerne dækker, og stiger når fx ratepensionerne ophører — så du med det samme kan se hvorfor formuen begynder at falde."],
                     en: ["See how much of your free funds you sell each year.", "New chart in Phase 2 (and now on the Fire and Barista charts too): hover over a year to see how much is sold. It's low while the pensions cover you, and rises once e.g. the ratepensions end — so you can immediately see why the wealth starts to fall."] },
        { ic: "🖱️", da: ["Nøgletallene opdaterer sig, når du kører hen over grafen.", "Kortene for salg og skat viser nu tallet for præcis det år, musen peger på — og går tilbage til år 1, når du forlader grafen."],
                     en: ["Key figures update as you move across the chart.", "The sale and tax cards now show the number for exactly the year the mouse points to — and revert to year 1 when you leave the chart."] },
        { ic: "🛡️", da: ["Livrenter: vælg markedsrente eller garanteret.", "For hver livrente kan du nu vælge markedsrente (svinger med afkastet, tilfalder arvinger) eller garanteret (fast udbetaling for livet, ingen arv). Det påvirker både udbetaling og hvad der er tilbage til arv."],
                     en: ["Life annuities: choose market-rate or guaranteed.", "For each life annuity you can now pick market-rate (varies with returns, passes to heirs) or guaranteed (fixed lifelong payout, no inheritance). It affects both the payout and what's left as inheritance."] }
      ]
    },
    {
      version: "0.2.61", date: "2026-07-16",
      items: [
        { ic: "🏖️", da: ["Ny: din pensionsindkomst pr. år, fordelt på type.", "Fase 2 (efter pension) har fået en søjlegraf som PensionsInfo, der viser din årlige indkomst fordelt på folkepension, livsvarige pensioner og ratepension. Hold musen over et år for at se årsløn og månedsløn efter skat."],
                     en: ["New: your pension income per year, broken down by type.", "Phase 2 (after retirement) now has a PensionsInfo-style bar chart showing your yearly income split into state pension, lifelong pensions and ratepension. Hover over a year to see the annual and monthly amount after tax."] },
        { ic: "💰", da: ["Livrenter, ATP og folkepension med i beregningen.", "Du kan nu tilføje flere livrenter (markedsrente eller garanteret) og ATP Livslang Pension, så hele din pensionsindkomst tælles med — også når ratepensionerne er udbetalt."],
                     en: ["Life annuities, ATP and state pension included.", "You can now add multiple life annuities (market-rate or guaranteed) and ATP lifelong pension, so all of your pension income is counted — including after the ratepensions have paid out."] },
        { ic: "🧮", da: ["Vælg beskatning af dine frie midler: lager eller realisation.", "Sæt et flueben alt efter om dine frie midler er ETF'er/fonde (lagerbeskatning: skat af årets afkast) eller aktier (realisation: skat ved salg) — så rammer skatten i beregningen rigtigt."],
                     en: ["Choose how your free funds are taxed: mark-to-market or realisation.", "Tick a box depending on whether your free funds are ETFs/funds (mark-to-market: taxed on the year's return) or shares (realisation: taxed on sale) — so the tax in the projection is right."] },
        { ic: "📊", da: ["Formuegrafen viser nu hvad den består af.", "Hold musen over formuekurven for at se hvor meget der er frie midler, ratepension og livrente på et givet tidspunkt."],
                     en: ["The wealth chart now shows what it's made of.", "Hover over the wealth curve to see how much is free funds, ratepension and life annuity at any point."] }
      ]
    },
    {
      version: "0.2.57", date: "2026-07-15",
      items: [
        { ic: "💱", da: ["Dagens afkast tager nu højde for valutakursen.", "Aktier i USD/EUR/GBP m.fl. viste kun kursbevægelsen i aktiens egen valuta — hvis valutakursen selv bevægede sig i løbet af dagen, talte det ikke med. Nu regnes begge dele med, både i det samlede overblik og på hvert enkelt depot."],
                     en: ["Today's return now accounts for currency moves.", "Stocks priced in USD/EUR/GBP etc. only showed the price move in the stock's own currency — if the exchange rate itself moved during the day, that wasn't counted. Now both are included, both in the combined overview and on each individual depot."] },
        { ic: "🔄", da: ["Siderne opdaterer sig nu selv, når du vender tilbage.", "Hvis en fane har ligget i baggrunden et stykke tid, opdateres tallene nu med det samme du skifter tilbage til den, i stedet for at vise gamle tal indtil næste automatiske opdatering."],
                     en: ["Pages now refresh themselves when you come back.", "If a tab has been in the background for a while, the numbers now update immediately when you switch back to it, instead of showing stale numbers until the next automatic refresh."] }
      ]
    },
    {
      version: "0.2.56", date: "2026-07-15",
      items: [
        { ic: "🎲", da: ["Ny: Monte Carlo-simulering i Fire-beregneren.", "I stedet for kun ét fast afkast kan du nu køre 1.000 tilfældige forløb og se sandsynligheden for at din plan lykkes — plus en graf med bedste/median/værste 10%. Du kan selv justere forventet afkast og volatilitet, og teste en god eller dårlig start på markedet."],
                     en: ["New: Monte Carlo simulation in the Fire calculator.", "Instead of just one fixed return, you can now run 1,000 randomized scenarios and see the probability your plan succeeds — plus a chart of best/median/worst 10%. You can adjust expected return and volatility yourself, and test a good or bad market start."] },
        { ic: "🏖️", da: ["Ratepension-udbetalingen følger nu markedet.", "I Monte Carlo-simuleringen genberegnes din ratepensions årlige udbetaling ud fra den faktiske saldo — går det godt, stiger udbetalingen; går det dårligt, falder den. Ligesom en rigtig ratepension."],
                     en: ["Ratepension payouts now follow the market.", "In the Monte Carlo simulation, your ratepension's yearly payout is recalculated from the actual balance — a good year raises it, a bad year lowers it. Just like a real ratepension."] },
        { ic: "🛟", da: ["Kontant buffer bruges nu rigtigt til kursfald.", "Bufferen dækker udgifter i år med markedsfald, så du ikke behøver sælge investeringer på et dårligt tidspunkt — det reducerer risikoen markant, hvis der kommer et dårligt startforløb."],
                     en: ["Cash buffer now correctly used during market drops.", "The buffer covers expenses in years with a market drop, so you don't have to sell investments at a bad time — this significantly reduces the risk from a bad starting sequence."] },
        { ic: "☕", da: ["Barista FIRE bygget om og sammenlignet med Fase 1.", "Barista FIRE er nu bygget op ligesom Fase 1 (samme graf og felter), deltidsindkomst beskattes korrekt, og Fase 2's graf kan nu vise to kurver, så du kan sammenligne almindelig FIRE med Barista FIRE."],
                     en: ["Barista FIRE rebuilt and compared against Phase 1.", "Barista FIRE is now built the same way as Phase 1 (same chart and fields), part-time income is taxed correctly, and Phase 2's chart can now show two curves so you can compare regular FIRE against Barista FIRE."] },
        { ic: "🏷️", da: ["Ratepensioner: navngiv rækker og træk dem om.", "Giv hver ratepension et navn og træk i ⠿-håndtaget for at ændre rækkefølgen."],
                     en: ["Ratepensions: name rows and drag to reorder.", "Give each ratepension a name and drag the ⠿ handle to change the order."] },
        { ic: "🔤", da: ["Aktieoverblik sorteres nu A-Z som standard.", "Sammen med en rettelse så dine egne tal (fx i Fire-beregneren) også er synlige ved print på hvidt papir."],
                     en: ["Holdings now sorts A-Z by default.", "Along with a fix so your own typed-in numbers (e.g. in the Fire calculator) are also visible when printing on white paper."] }
      ]
    },
    {
      version: "0.2.52", date: "2026-07-15",
      items: [
        { ic: "📊", da: ["Aktie-heatmap sorteres nu efter dagens ændring.", "Boksene på Portfolio Overview vises med størst stigning øverst til venstre i stedet for efter værdi."],
                     en: ["Stock heatmap now sorted by today's change.", "Boxes on Portfolio Overview show the biggest gainers first instead of being sorted by value."] },
        { ic: "🧊", da: ["Selskabsnavnet bliver stående når du scroller.", "I aktieoverblikkets tabel (både per depot og på det samlede overblik) er kolonnen med navnet nu fastfrosset, så du altid kan se hvilken aktie rækken hører til."],
                     en: ["Company name stays put while you scroll.", "In the holdings table (both per depot and on the combined overview), the name column is now frozen so you always see which stock a row belongs to."] },
        { ic: "🏖️", da: ["Fase 2: personfradrag og flere ratepensioner.", "Der er nu et skattefrit personfradrag pr. måned i beregningen, og du kan tilføje flere ratepensioner — hver med sin egen værdi og udbetalingsperiode."],
                     en: ["Phase 2: tax-free allowance and multiple ratepensions.", "There's now a monthly tax-free personal allowance in the calculation, and you can add several ratepensions — each with its own value and payout period."] },
        { ic: "🔢", da: ["Beløb i Fire-beregneren vises nu med punktum.", "Skriv fx 700000 i et beløbsfelt, og se 700.000 kr. når du er færdig med at taste — lettere at læse end en række nuller."],
                     en: ["Amounts in the Fire calculator now show thousand separators.", "Type e.g. 700000 in an amount field and see 700,000 kr. once you're done typing — easier to read than a string of zeros."] },
        { ic: "🈴", da: ["\"Yield\" hedder nu \"Udbytte\" konsekvent på dansk.", "Sammen med en opdateret standard for aktieskat-grænsen (79.400 kr) og øjet til at skjule beløb, der nu sidder ved siden af Print-knappen."],
                     en: ["\"Yield\" is now consistently called \"Udbytte\" in Danish.", "Along with an updated default for the share-tax threshold (79,400 kr) and the privacy eye, which now sits next to the Print button."] }

    {
      version: "0.2.51", date: "2026-07-14",
      items: [
        { ic: "📈", da: ["Rettet: amerikanske aktier viste ~0% afkast om aftenen.", "Om aftenen (dansk tid = amerikansk lukketid) viste 'I dag' kun den lille eftermarkeds-bevægelse i stedet for dagens rigtige afkast. Nu vises dagens korrekte bevægelse hele aftenen."],
                     en: ["Fixed: US stocks showed ~0% return in the evening.", "In the evening (Danish time = US after-hours), 'Today' only showed the tiny post-market move instead of the day's real return. Now the correct day return shows all evening."] },
        { ic: "🏖️", da: ["Fase 2: mere retvisende beregning.", "Folkepension udbetales nu først fra folkepensionsalderen (ikke fra din startalder), og overskydende pension bliver ikke længere gemt oveni formuen — det bruges bare som en del af lønnen, som i virkeligheden."],
                     en: ["Phase 2: more accurate calculation.", "State pension now only pays from the state-pension age (not your start age), and surplus pension is no longer saved on top of wealth — it's just spent as part of your income, like in reality."] }
      ]

    {
      version: "0.2.50", date: "2026-07-14",
      items: [
        { ic: "💸", da: ["Skriv dit ønskede rådighedsbeløb pr. måned.", "I begge FIRE-faser kan du nu taste hvad du vil have til rådighed om måneden — så beregner appen baglæns hvor meget der skal til før skat."],
                     en: ["Enter your desired monthly disposable amount.", "In both FIRE phases you can now type what you want to have available each month — the app works backwards to how much is needed before tax."] },
        { ic: "🏢", da: ["Tag værdier i selskab (ApS) med i Fase 1.", "Penge i et selskab kan nu indgå — de forrentes som resten, men beskattes 42% når de trækkes ud af firmaet."],
                     en: ["Include company (ApS) value in Phase 1.", "Money in a company can now be included — it grows like the rest but is taxed 42% when withdrawn from the company."] }
      ]
    },
    {
      version: "0.2.49", date: "2026-07-14",
      items: [
        { ic: "🎯", da: ["FIRE Progress: se hvornår du når dit mål.", "På Fire-fanen kan du sætte dit FIRE-tal og se hvor langt du er, plus en estimeret FIRE-dato ud fra din formue + årlige indbetalinger og valgt afkast — vokset efter aktieskat."],
                     en: ["FIRE Progress: see when you'll reach your goal.", "On the Fire tab you can set your FIRE number and see how far you are, plus an estimated FIRE date from your wealth + yearly contributions and chosen return — grown net of share tax."] },
        { ic: "🗂️", da: ["Vælg hvilke depoter der er frie midler vs. pension.", "På det samlede overblik tagger du hvert depot som Frit, Pension eller fra — så beregningerne kører på de rigtige penge."],
                     en: ["Choose which depots are free funds vs. pension.", "On the combined overview you tag each depot as Free, Pension or off — so the calculations run on the right money."] },
        { ic: "🔥", da: ["To-faset nedsparing før og efter pension.", "Fase 1 viser om dine frie midler rækker indtil pensionen starter (med aktieskat og evt. kontant buffer). Fase 2 viser om pension + resten kan finansiere resten af livet — med ratepension, livrente, folkepension, PAL-skat og månedsløn efter skat."],
                     en: ["Two-phase drawdown before and after pension.", "Phase 1 shows whether your free funds last until the pension starts (with share tax and an optional cash buffer). Phase 2 shows whether pension + the rest can finance the rest of life — with ratepension, life annuity, state pension, PAL tax and monthly income after tax."] }
      ]
    },
    {
      version: "0.2.48", date: "2026-07-14",
      items: [
        { ic: "💾", da: ["Fire: dine tal gemmes nu pr. depot.", "Tidligere delte alle depoter de samme Fire-tal. Nu husker hvert depot sine egne tal for afkast, indbetaling og antal år — så du ser de rigtige tal for det depot, du står på."],
                     en: ["Fire: your numbers are now saved per depot.", "Previously all depots shared the same Fire numbers. Now each depot remembers its own return, contribution and years — so you see the right numbers for the depot you're on."] }
      ]

    {

      meta: "What's new in Portfolio Dashboard — an overview of the latest updates, improvements and fixes.",
      nav_download: "Download",
      nav_faq: "FAQ",
      eyebrow: "What's new",
      h1: "Release notes",
      sub: "A short overview of what the latest updates add and fix. The app updates itself — you don't have to do anything.",
      latest: "Latest",
      footer: "Portfolio Dashboard · private app · data from Yahoo Finance",
      footer_home: "Home",
      footer_faq: "FAQ",
      footer_support: "Support development"
    }
  };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function renderReleases(lang) {
    var latestLabel = (STR[lang] || STR.en).latest;
    var html = "";
    for (var i = 0; i < RELEASES.length; i++) {
      var r = RELEASES[i];
      var badge = i === 0 ? ' <span class="rel-latest">' + esc(latestLabel) + "</span>" : "";
      html += '<div class="rel"><div class="rel-head">' +
        '<span class="rel-ver">' + esc(r.version) + "</span>" + badge +
        '<span class="rel-date">' + esc(r.date) + "</span></div><ul>";
      for (var j = 0; j < r.items.length; j++) {
        var it = r.items[j];
        var parts = it[lang] || it.en;
        html += '<li><span class="ic">' + it.ic + '</span><span class="tx"><b>' +
          esc(parts[0]) + "</b><span>" + esc(parts[1]) + "</span></span></li>";
      }
      html += "</ul></div>";
    }
    document.getElementById("releases").innerHTML = html;
  }

  function apply(lang) {
    var dict = STR[lang] || STR.en;
    document.documentElement.lang = lang;
    document.title = dict.title;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute("content", dict.meta);
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute("data-i18n");
      if (dict[k] != null) nodes[i].innerHTML = dict[k];
    }
    var btns = document.querySelectorAll("[data-lang]");
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute("aria-pressed", btns[j].getAttribute("data-lang") === lang ? "true" : "false");
    }
    renderReleases(lang);
  }

  function saved() { try { return localStorage.getItem("pd_lang"); } catch (e) { return null; } }
  function save(l) { try { localStorage.setItem("pd_lang", l); } catch (e) {} }

  var manual = saved();
  apply(manual || ((navigator.language || "").toLowerCase().indexOf("da") === 0 ? "da" : "en"));

  if (!manual) {
    // Same country rule as the landing page: Danish only for Denmark.
    fetch("/api/geo")
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!saved()) apply(d && d.country === "DK" ? "da" : "en"); })
      .catch(function () {});
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-lang]") : null;
    if (!b) return;
    save(b.getAttribute("data-lang"));
    apply(b.getAttribute("data-lang"));
  });
})();
